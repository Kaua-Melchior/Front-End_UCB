<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy - Adicionar Orfanato</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body style="font-family: 'Nunito', sans-serif; overflow: hidden; background-color: #EBF2F5;">

    <!-- Usando o componente Carousel do Bootstrap para fazer a animação lateral sem Javascript customizado ou CSS -->
    <div id="appCarousel" class="carousel slide" data-bs-touch="false" data-bs-wrap="false" data-bs-keyboard="false">
        <div class="carousel-inner h-100">

            <!-- ====== SLIDE 1: HOME PAGE ====== -->
            <div class="carousel-item active vh-100 w-100"
                style="background: linear-gradient(329.54deg, #29B6D1 0%, #00C7C7 100%);">
                <div class="container d-flex flex-column h-100 py-4 px-3 px-md-4 position-relative">

                    <!-- Cabeçalho -->
                    <header class="d-flex justify-content-between align-items-center mb-4 pt-3">
                        <img src="./src/Logo.png" alt="Happy Logo" class="img-fluid" style="max-height: 60px;">
                        <div class="text-end text-white">
                            <div class="fw-bold fs-5">Rio do Sul</div>
                            <div class="fs-6 fw-normal">Santa Catarina</div>
                        </div>
                    </header>

                    <!-- Conteúdo Principal -->
                    <main class="row flex-grow-1 align-items-center pb-5 pb-md-4">
                        <div
                            class="col-md-5 d-flex flex-column justify-content-center justify-content-md-between h-100 text-center text-md-start text-white pt-4 pb-md-5">
                            <h1 class="display-1 fw-bold lh-1 mb-4 mt-md-5" style="letter-spacing: -2px;">Leve<br
                                    class="d-none d-md-block">felicidade<br class="d-none d-md-block">para o<br
                                    class="d-none d-md-block">mundo</h1>
                            <p class="fs-4 fw-semibold mt-md-auto mx-auto mx-md-0"
                                style="max-width: 320px; line-height: 1.4;">Visite orfanatos e mude o dia de muitas
                                crianças.</p>
                        </div>

                        <div
                            class="col-md-7 d-flex justify-content-center align-items-center h-100 mt-4 mt-md-0 position-relative">
                            <img src="./src/Ilustra02.png" alt="Ilustração de Crianças Brincando" class="img-fluid"
                                style="max-height: 75vh; object-fit: contain;">
                        </div>
                    </main>

                    <!-- Botão Avançar usando controle nativo do Carousel -->
                    <button type="button" data-bs-target="#appCarousel" data-bs-slide="next"
                        class="position-absolute bottom-0 end-0 mb-4 mb-md-5 me-3 me-md-4 p-0 bg-transparent border-0 z-3"
                        style="transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'"
                        onmouseout="this.style.transform='scale(1)'">
                        <img src="./src/Botão.png" alt="Avançar" style="max-width: 80px;">
                    </button>
                </div>
            </div>

            <!-- ====== SLIDE 2: FORM PAGE ====== -->
            <div class="carousel-item vh-100 w-100" style="background-color: #EBF2F5;">
                <div class="d-flex h-100 w-100">

                    <!-- Sidebar Lateral Fixa -->
                    <aside
                        class="d-flex flex-column justify-content-between align-items-center py-4 flex-shrink-0 shadow-sm"
                        style="background-color: #15C3D6; width: 96px; z-index: 10;">
                        <img src="./src/LogoManor.png" alt="Happy Logo Menor" style="width: 48px;">

                        <!-- Botão de Voltar para Home usando controle nativo do Carousel -->
                        <button type="button" data-bs-target="#appCarousel" data-bs-slide="prev"
                            class="btn d-flex justify-content-center align-items-center p-0 border-0"
                            style="width: 48px; height: 48px; background-color: #12AFCB; border-radius: 16px; transition: background-color 0.2s;"
                            onmouseover="this.style.backgroundColor='#17D6EB'"
                            onmouseout="this.style.backgroundColor='#12AFCB'">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </aside>

                    <!-- Área Central do Formulário -->
                    <main class="flex-grow-1 overflow-hidden d-flex flex-column align-items-center pt-4 pb-4 h-100">

                        <span class="mb-4 fw-semibold flex-shrink-0" style="color: #8FA7B3;">Adicione um orfanato</span>

                        <form class="bg-white rounded-4 p-4 p-md-5 shadow-sm overflow-y-auto w-100 h-100"
                            style="max-width: 700px; border: 1px solid #D3E2E5;">
                            <!-- DADOS -->
                            <fieldset class="border-0 p-0 m-0 mb-5">
                                <legend class="fw-bold fs-3 w-100 pb-3 mb-4"
                                    style="color: #5C8599; border-bottom: 1px solid #D3E2E5;">Dados</legend>

                                <!-- Mapa Placeholder -->
                                <div class="mb-4 rounded-4 overflow-hidden border"
                                    style="border-color: #D3E2E5 !important;">
                                    <img src="./src/Mapa.png" alt="Mapa" class="w-100"
                                        style="height: 220px; object-fit: cover;">
                                    <div class="text-center py-3" style="background-color: #F5F8FA;">
                                        <span class="fw-bold" style="color: #0089A5; font-size: 14px;">Clique no mapa
                                            para adicionar a localização</span>
                                    </div>
                                </div>

                                <!-- Nome -->
                                <div class="mb-4 text-start">
                                    <label class="form-label fw-semibold" style="color: #8FA7B3;">Nome</label>
                                    <input type="text" class="form-control form-control-lg shadow-none"
                                        style="background-color: #F5F8FA; border: 1px solid #D3E2E5; border-radius: 15px; color: #5C8599;">
                                </div>

                                <!-- Sobre -->
                                <div class="mb-4 text-start">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <label class="form-label mb-0 fw-semibold" style="color: #8FA7B3;">Sobre</label>
                                        <span class="fw-semibold" style="color: #8FA7B3; font-size: 12px;">Máximo de 300
                                            caracteres</span>
                                    </div>
                                    <textarea class="form-control shadow-none" rows="4"
                                        style="background-color: #F5F8FA; border: 1px solid #D3E2E5; border-radius: 15px; color: #5C8599;"></textarea>
                                </div>

                                <!-- Whatsapp -->
                                <div class="mb-4 text-start">
                                    <label class="form-label fw-semibold" style="color: #8FA7B3;">Número de
                                        Whatsapp</label>
                                    <input type="text" class="form-control form-control-lg shadow-none"
                                        style="background-color: #F5F8FA; border: 1px solid #D3E2E5; border-radius: 15px; color: #5C8599;">
                                </div>

                                <!-- Fotos -->
                                <div class="mb-4 text-start">
                                    <label class="form-label mb-2 fw-semibold" style="color: #8FA7B3;">Fotos</label>
                                    <div class="d-flex flex-wrap gap-2">
                                        <button type="button"
                                            class="btn d-flex justify-content-center align-items-center p-0"
                                            style="width: 96px; height: 96px; background-color: #F5F8FA; border: 1px dashed #96D2F0; border-radius: 20px;">
                                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <path d="M12 5V19M5 12H19" stroke="#15B6D6" stroke-width="2"
                                                    stroke-linecap="round" stroke-linejoin="round" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </fieldset>

                            <!-- VISITAÇÃO -->
                            <fieldset class="border-0 p-0 m-0 mb-5">
                                <legend class="fw-bold fs-3 w-100 pb-3 mb-4"
                                    style="color: #5C8599; border-bottom: 1px solid #D3E2E5;">Visitação</legend>

                                <!-- Instruções -->
                                <div class="mb-4 text-start">
                                    <label class="form-label fw-semibold" style="color: #8FA7B3;">Instruções</label>
                                    <textarea class="form-control shadow-none" rows="4"
                                        style="background-color: #F5F8FA; border: 1px solid #D3E2E5; border-radius: 15px; color: #5C8599;"></textarea>
                                </div>

                                <!-- Horário das visitas -->
                                <div class="mb-4 text-start">
                                    <label class="form-label fw-semibold" style="color: #8FA7B3;">Horário das
                                        visitas</label>
                                    <input type="text" class="form-control form-control-lg shadow-none"
                                        style="background-color: #F5F8FA; border: 1px solid #D3E2E5; border-radius: 15px; color: #5C8599;">
                                </div>

                                <!-- Atende fim de semana -->
                                <div class="mb-4 text-start d-flex justify-content-between align-items-center">
                                    <label class="form-label mb-0 fw-semibold" style="color: #8FA7B3;">Atende fim de
                                        semana?</label>
                                    <div class="form-check form-switch m-0 fs-5">
                                        <input class="form-check-input shadow-none" type="checkbox" role="switch"
                                            checked style="cursor: pointer;">
                                    </div>
                                </div>
                            </fieldset>

                            <!-- Botão Confirmar -->
                            <button type="button" class="btn w-100 py-3 fw-bold fs-5 text-white border-0"
                                style="background-color: #3CDC8C; border-radius: 20px; transition: filter 0.2s;"
                                onmouseover="this.style.filter='brightness(0.95)'"
                                onmouseout="this.style.filter='brightness(1)'">
                                Confirmar
                            </button>

                        </form>
                    </main>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
